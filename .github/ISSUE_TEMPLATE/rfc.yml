name: 📝 RFC
description: Нужен текстовый разбор сложного или рискованного решения.
title: "RFC: "
labels:
  - "type:research"
body:
  - type: markdown
    attributes:
      value: |
        Используй RFC, только если несколько вариантов имеют заметные последствия.
        Для обычной работы достаточно короткой заметки в issue.

  - type: textarea
    id: context
    attributes:
      label: Контекст и мотивация
      description: Почему сейчас. Что меняется в продукте, организации или среде.

  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Что предлагается сделать, в общих чертах.

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
      description: Почему отвергнуты. Сравнение по стоимости, риску, ограничениям.

  - type: textarea
    id: impact
    attributes:
      label: Затронутые области
      description: Репозитории, контракты, процессы. Где потребуются изменения.

  - type: textarea
    id: risks
    attributes:
      label: Риски и обратимость
      description: Что может пойти не так. Можно ли откатить.

  - type: textarea
    id: decision
    attributes:
      label: Запрашиваемое решение
      description: Что фиксируется этим RFC. Дата принятия, участники.

  - type: dropdown
    id: area
    attributes:
      label: Затронутая область
      multiple: true
      options:
        - area:backend
        - area:contracts
        - area:web
        - area:desktop
        - area:android
        - area:flutter
        - area:ops
        - area:hq
