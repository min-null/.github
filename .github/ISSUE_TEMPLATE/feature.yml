name: ✨ Feature
description: Новая возможность или улучшение
title: "[feature] "
labels:
  - "type:feature"
body:
  - type: textarea
    id: outcome
    attributes:
      label: Что хотим улучшить?
      description: Для кого это и какой результат ожидаем? Пары предложений достаточно.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Границы (необязательно)
      description: Что входит в задачу и что оставим на потом?

  - type: textarea
    id: verification
    attributes:
      label: Как проверим (необязательно)
      description: Пример сценария или сигнал, который покажет, что получилось.

  - type: textarea
    id: context
    attributes:
      label: Ссылки и контекст (необязательно)
      description: Добавь только то, что уже известно и поможет исполнителю.
