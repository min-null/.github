name: 🐞 Bug
description: Что-то работает не так
title: "[bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: problem
    attributes:
      label: Что случилось?
      description: Что ты делал и что увидел?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось? (необязательно)

  - type: textarea
    id: context
    attributes:
      label: Где и как повторить? (необязательно)
      description: Клиент, версия, окружение, шаги, логи или скриншот — что уже известно.
