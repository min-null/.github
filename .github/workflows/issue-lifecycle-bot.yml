name: Issue Lifecycle Bot

# Manual-only since minchat-hq#193: the org GitHub Actions quota is exhausted,
# so every automatic run failed in ~2s without executing a single step.
# workflow_dispatch (including its inputs) and workflow_call are unchanged, so
# manual runs and reusable-workflow callers keep working. Restore the removed
# triggers with `git revert` once the quota problem is solved.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
        description: 'Optional caller token; falls back to runner GITHUB_TOKEN'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      github.event.pull_request.merged == true
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check out lifecycle parser
        uses: actions/checkout@v5
        with:
          repository: min-null/.github
          ref: main
          persist-credentials: false
      - name: Update linked issues
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          set -euo pipefail

          FLOW_REPOS=("$EVENT_REPOSITORY")

          ensure_label() {
            gh label create "$1" --color "$2" --repo "$3" --force >/dev/null 2>&1 || true
          }


          # Step 1: decide target repos
          TARGET=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET=("$EVENT_REPOSITORY")
          else
            TARGET=("${FLOW_REPOS[@]}")
          fi

          # Step 2: bootstrap labels in each target repo
          for repo in "${TARGET[@]}"; do
            ensure_label status:in-review fbca04 "$repo" || true
            ensure_label status:in-develop 0e8a16 "$repo" || true
            ensure_label status:in-release bfdadc "$repo" || true
            ensure_label status:released 0075ca "$repo" || true
          done

          # Step 3: process PRs. For PR event, just that one. For schedule, recent merges last eight days.
          process_pr() {
            local repo="$1" num="$2" base="$3" body="$4" pr_url="$5" head="$6" release_label="$7"
            local refs
            local release_arg=()
            [ "$release_label" = "true" ] && release_arg=(--release)
            refs=$(python3 .github/scripts/issue_lifecycle_links.py --repo "$repo" --head "$head" --base "$base" "${release_arg[@]}" <<<"$body")
            [ -z "$refs" ] && { echo "  $repo #$num: no linked issues, skip"; return 0; }

            local new_label comment close_issue
            if [ "$base" = "main" ]; then
              new_label=status:released
              close_issue=true
            elif [ "$release_label" = "true" ]; then
              new_label=status:in-release
              close_issue=false
            elif [ "$base" = "develop" ]; then
              new_label=status:in-develop
              close_issue=false
            else
              return 0
            fi

            while IFS=$'\t' read -r issue_repo issue explicitly_closes should_close; do
              [ -z "$issue_repo" ] && continue
              echo "  $issue_repo #$issue → $new_label"

              # A tagged release closes the fully-qualified cross-repo issue.
              ensure_label status:in-review fbca04 "$issue_repo"
              ensure_label status:in-develop 0e8a16 "$issue_repo"
              ensure_label status:in-release bfdadc "$issue_repo"
              ensure_label status:released 0075ca "$issue_repo"

              # Комментарий зависит от того, закрывающий это PR или лишь упоминающий.
              if [ "$base" = "main" ] && [ "$should_close" = "true" ]; then
                comment="[lifecycle-bot] 🎉 Released to \`main\` and closed via [#${num}](${pr_url})."
              elif [ "$base" = "main" ]; then
                comment="[lifecycle-bot] 🎉 Released to \`main\` via [#${num}](${pr_url}). Issue remains open: the PR only mentions the task."
              elif [ "$explicitly_closes" = "true" ]; then
                comment="[lifecycle-bot] 🟢 Merged to \`develop\` via [#${num}](${pr_url}); issue will close after release to \`main\`."
              else
                case "$new_label" in
                  status:in-release)
                    comment="[lifecycle-bot] 🚀 Release PR opened: [#${num}](${pr_url})."
                    ;;
                  *)
                    comment="[lifecycle-bot] 🟢 Merged to \`develop\` via [#${num}](${pr_url})."
                    ;;
                esac
              fi

              if gh issue view "$issue" --repo "$issue_repo" --json comments --jq '.comments[].body' 2>/dev/null | grep -Fxq -- "$comment"; then
                echo "    (comment already exists)"
              elif gh issue comment "$issue" --repo "$issue_repo" --body "$comment" 2>/dev/null; then
                :
              else
                echo "    (no comment access, skipping comment)"
              fi

              # Monotone status: ровно одна status-метка отражает текущее состояние.
              local stale_labels
              stale_labels=$(gh issue view "$issue" --repo "$issue_repo" --json labels --jq '.labels[].name' 2>/dev/null \
                | grep -E '^status:' | grep -vxF "$new_label" || true)
              for stale in $stale_labels; do
                gh issue edit "$issue" --repo "$issue_repo" --remove-label "$stale" 2>/dev/null \
                  && echo "    removed $stale"
              done

              if gh issue edit "$issue" --repo "$issue_repo" --add-label "$new_label" 2>/dev/null; then
                :
              else
                echo "    (no edit access, skipping label)"
              fi
              if [ "$close_issue" = "true" ] && [ "$should_close" = "true" ]; then
                if gh issue close "$issue" --repo "$issue_repo" --reason completed; then
                  echo "    closed $issue_repo#$issue"
                else
                  echo "::error::Could not close $issue_repo#$issue after PR $pr_url; verify that issue and token access exist." >&2
                fi
              fi
            done <<<"$refs"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            jq -r '
              .pull_request |
              [.number, .base.ref, .body // "", .html_url, .head.ref, (.labels // [] | map(.name) | join(","))] |
              @tsv
            ' <<<"$EVENT_PAYLOAD" | while IFS=$'\t' read -r num base body pr_url head labels; do
              has_release="false"
              echo "$labels" | grep -qw release && has_release="true"
              process_pr "$EVENT_REPOSITORY" "$num" "$base" "$body" "$pr_url" "$head" "$has_release"
            done
          else
            since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                    date -u -v-8d +%Y-%m-%dT%H:%M:%SZ)
            for repo in "${TARGET[@]}"; do
              echo "--- $repo ---"
              prs=$(gh pr list --repo "$repo" --state merged --limit 1000 --search "merged:>=$since" --json number,baseRefName,body,url,headRefName,labels 2>/dev/null) || {
                echo "  (skipped: no access)"
                continue
              }
              echo "$prs" | jq -c '.[]' | while read -r pr; do
                num=$(echo "$pr" | jq -r .number)
                base=$(echo "$pr" | jq -r .baseRefName)
                body=$(echo "$pr" | jq -r '.body // ""')
                pr_url=$(echo "$pr" | jq -r .url)
                head=$(echo "$pr" | jq -r .headRefName)
                labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')
                has_release="false"
                echo "$labels" | grep -qw release && has_release="true"
                process_pr "$repo" "$num" "$base" "$body" "$pr_url" "$head" "$has_release"
              done
            done
          fi

  # ---------------------------------------------------------------
  # Inbox auto-stamper: ставит status:inbox на свежие issue без меток.
  # Триггер: при открытии issue. Не трогает существующие метки.
  # ---------------------------------------------------------------
  inbox-stamper:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Stamp status:inbox on unlabeled issue
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Убеждаемся, что метка существует
          gh label create "status:inbox" --color "fef2c0" \
            --description "Новая issue, не разобрана. Бот ставит автоматически" \
            --repo "$REPO" --force >/dev/null 2>&1 || true

          # Получаем текущие метки issue
          current_labels=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          # Не трогаем, если уже есть какие-то метки (значит, человек уже разбирает)
          if [ -n "$current_labels" ]; then
            echo "Issue #$ISSUE_NUMBER already has labels ($current_labels), skip"
            exit 0
          fi

          # Бот ставит status:inbox
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "status:inbox" 2>/dev/null || \
            echo "  (no edit access, skipping)"
          echo "Issue #$ISSUE_NUMBER → status:inbox"

  # ---------------------------------------------------------------
  # Stale-detector: ставит coordination:needs-decision на застрявшие issue.
  # Триггер: еженедельная подстраховка, только текущий репозиторий.
  # Исключения:
  #   - issue имеет assignees (кто-то работает)
  #   - issue уже released
  #   - уже есть coordination:needs-decision
  # Для эпиков: дополнительно проверяем наличие ## Sub-tasks (7 дней).
  # ---------------------------------------------------------------
  stale-detector:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Detect stale issues
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FLOW_REPOS=("$EVENT_REPOSITORY")

          ensure_label() {
            gh label create "$1" --color "$2" --description "$3" \
              --repo "$4" --force >/dev/null 2>&1 || true
          }

          for repo in "${FLOW_REPOS[@]}"; do
            echo "--- $repo ---"
            ensure_label "coordination:needs-decision" "fbc740" \
              "Задача застряла, нужно решение" "$repo"

            # Получаем открытые issue, обновлённые более 14 дней назад.
            # REST API пагинируется один раз; фильтрация по updated_at локальная.
            cutoff=$(date -u -d '14 days ago' +%Y-%m-%d 2>/dev/null || \
                     date -u -v-14d +%Y-%m-%d)

            issues=$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | {number, title, labels, assignees, updatedAt: .updated_at}' \
              | jq -c --arg cutoff "$cutoff" 'select(.updatedAt[0:10] < $cutoff)') || { echo "Cannot inspect stale issues in $repo" >&2; exit 1; }

            if [ -z "$issues" ]; then
              continue
            fi

              echo "$issues" | while read -r issue; do
                num=$(echo "$issue" | jq -r .number)
                labels=$(echo "$issue" | jq -r '[.labels[].name] | join(",")')
                assignees=$(echo "$issue" | jq -r '[.assignees[].login] | join(",")')

                # Пропускаем, если есть assignees
                if [ -n "$assignees" ]; then
                  echo "  #$num: skip (has assignee)"
                  continue
                fi

                # Пропускаем, если уже released или in-review/in-develop/in-release
                if echo "$labels" | grep -qwE 'status:(released|in-review|in-develop|in-release)'; then
                  echo "  #$num: skip (active status)"
                  continue
                fi

                # Пропускаем, если уже стоит coordination:needs-decision
                if echo "$labels" | grep -qw 'coordination:needs-decision'; then
                  echo "  #$num: skip (already needs-decision)"
                  continue
                fi

                # Проверяем, эпик ли это (есть type:feature + area:hq или нет sub-tasks через 7 дней)
                is_epic=false
                if echo "$labels" | grep -qw 'area:hq' && echo "$labels" | grep -qwE 'type:feature|type:research'; then
                  # Эпик = issue с type:feature|research и area:hq.
                  # Проверяем body на ## Sub-tasks
                  body=$(gh issue view "$num" --repo "$repo" --json body --jq '.body // ""' 2>/dev/null || echo "")
                  if ! echo "$body" | grep -qiE '^##[[:space:]]*sub-tasks'; then
                    created_cutoff=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || \
                                     date -u -v-7d +%Y-%m-%d)
                    created_at=$(gh issue view "$num" --repo "$repo" --json createdAt --jq '.createdAt' 2>/dev/null | cut -c1-10 || echo "")
                    if [ -n "$created_at" ] && [ "$created_at" \< "$created_cutoff" ]; then
                      is_epic=true
                      reason="epic без ## Sub-tasks более 7 дней"
                    fi
                  fi
                fi

                if [ "$is_epic" != "true" ]; then
                  # По умолчанию — обычная stale-проверка (14 дней без активности).
                      reason="нет активности более 14 дней"
                fi

                echo "  #$num → coordination:needs-decision ($reason)"
                gh issue edit "$num" --repo "$repo" --add-label "coordination:needs-decision" 2>/dev/null || \
                  echo "    (no edit access, skipping)"
                comment_body="[lifecycle-bot] ⏰ Задача помечена как застрявшая: **$reason**. Нужно решение — принять, закрыть или эскалировать. См. saved view «Feature Planning»."
                gh issue comment "$num" --repo "$repo" --body "$comment_body" 2>/dev/null || \
                  echo "    (no comment access, skipping)"
              done

          done

  # ---------------------------------------------------------------
  # Label-reconciler: приводит существующие issue к монотонному status.
  # Триггер: расписание, ручной запуск, вызов из репозитория-источника.
  # Работает по всем issue, а не только по упомянутым в недавних PR,
  # поэтому чинит хвост, накопившийся до появления монотонности.
  #
  # Правила:
  #   - бот назначает только свои метки: inbox, in-review, in-develop,
  #     in-release, released. pickable и backlog — решение человека.
  #   - закрытые issue теряют все status:* кроме status:released.
  #   - approval-метки, type/area/priority/needs/coordination не трогаются.
  #   - прогон идемпотентен: чистое состояние не порождает изменений.
  # ---------------------------------------------------------------
  label-reconciler:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1')
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Reconcile status labels
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FLOW_REPOS=("$EVENT_REPOSITORY")

          # Ранг бот-управляемых меток. Больше — дальше по процессу.
          rank_status() {
            case "$1" in
              status:released)  echo 5 ;;
              status:in-release) echo 4 ;;
              status:in-develop) echo 3 ;;
              status:in-review)  echo 2 ;;
              status:inbox)      echo 1 ;;
              *)                 echo 0 ;;
            esac
          }

          for repo in "${FLOW_REPOS[@]}"; do
            echo "--- $repo (open) ---"

            # Открытые issue с несколькими status:*.
            gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | {number, labels: [.labels[].name]}' \
              | jq -c 'select([.labels[] | select(startswith("status:"))] | length > 1)' \
              | while read -r issue; do
                num=$(echo "$issue" | jq -r '.number')
                keep=""
                best=0
                for l in $(echo "$issue" | jq -r '.labels[] | select(startswith("status:"))'); do
                  r=$(rank_status "$l")
                  if [ "$r" -gt "$best" ]; then
                    best=$r
                    keep="$l"
                  fi
                done

                # Только pickable/backlog, без бот-меток: решение человека, не трогаем.
                if [ "$best" -eq 0 ]; then
                  echo "  #$num: skip (no bot-managed status)"
                  continue
                fi

                echo "  #$num: keep $keep"
                removed=""
                for l in $(echo "$issue" | jq -r '.labels[] | select(startswith("status:"))'); do
                  [ "$l" = "$keep" ] && continue
                  if gh issue edit "$num" --repo "$repo" --remove-label "$l" 2>/dev/null; then
                    echo "    removed $l"
                    removed="$removed $l"
                  fi
                done

                if [ -n "$removed" ]; then
                  gh issue comment "$num" --repo "$repo" --body \
                    "[lifecycle-bot] Метки статуса приведены в соответствие: оставлена \`$keep\` как дальнейшая по процессу. Снято:$removed. Правило «ровно одна \`status:*\` отражает текущее состояние»." \
                    2>/dev/null || echo "    (no comment access, skipping comment)"
                fi
              done

            echo "--- $repo (closed) ---"

            # Закрытые issue: статус незавершённых работ здесь не имеет смысла.
            gh api --paginate "repos/$repo/issues?state=closed&per_page=100" \
              --jq '.[] | select(.pull_request == null) | {number, labels: [.labels[].name]}' \
              | jq -c 'select(any(.labels[]; startswith("status:")))' \
              | while read -r issue; do
                num=$(echo "$issue" | jq -r '.number')
                removed=""
                for l in $(echo "$issue" | jq -r '.labels[] | select(startswith("status:"))'); do
                  [ "$l" = "status:released" ] && continue
                  if gh issue edit "$num" --repo "$repo" --remove-label "$l" 2>/dev/null; then
                    echo "  #$num: removed $l"
                    removed="$removed $l"
                  fi
                done
                if [ -n "$removed" ]; then
                  gh issue comment "$num" --repo "$repo" --body \
                    "[lifecycle-bot] Issue закрыта, незавершённые статусы сняты:$removed. Открытая задача больше не находится в пайплайне." \
                    2>/dev/null || echo "  #$num: (no comment access, skipping comment)"
                fi
              done
          done

          echo "Reconcile done."
