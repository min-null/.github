name: Issue Lifecycle Bot

on:
  issues:
    types: [opened]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    types: [closed]
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
        description: 'Optional caller token; falls back to runner GITHUB_TOKEN'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-lifecycle-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      github.event.pull_request.merged == true
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Update linked issues
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          set -euo pipefail

          FLOW_REPOS=("$EVENT_REPOSITORY")

          ensure_label() {
            gh label create "$1" --color "$2" --repo "$repo" --force >/dev/null 2>&1 || true
          }


          # Step 1: decide target repos
          TARGET=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET=("$EVENT_REPOSITORY")
          else
            TARGET=("${FLOW_REPOS[@]}")
          fi

          # Step 2: bootstrap labels in each target repo
          for repo in "${TARGET[@]}"; do
            ensure_label status:in-review fbca04 || true
            ensure_label status:in-develop 0e8a16 || true
            ensure_label status:in-release bfdadc || true
            ensure_label status:released 0075ca || true
          done

          # Step 3: process PRs. For PR event, just that one. For schedule, recent merges last eight days.
          process_pr() {
            local repo="$1" num="$2" base="$3" body="$4" pr_url="$5" head="$6" release_label="$7"
            local issues closing_issues
            # Р”РІР° РєР»Р°СЃСЃР° СЃРёРіРЅР°Р»РѕРІ:
            #   closing    вЂ” closes|fixes|resolves (+ fix|close). PR Р·Р°РІРµСЂС€Р°РµС‚ Р·Р°РґР°С‡Сѓ.
            #   mentioning вЂ” refs|see|part of. PR Р»РёС€СЊ СѓРїРѕРјРёРЅР°РµС‚ Р·Р°РґР°С‡Сѓ (С‚РёРїРёС‡РЅРѕ РґР»СЏ
            #                release-PR, РіРґРµ head-РІРµС‚РєР° `develop`, Р° РІ С‚РµР»Рµ `Refs #N`).
            # РљРѕСЂРѕС‚РєР°СЏ С„РѕСЂРјР° `Refs #N`. Р”Р»РёРЅРЅР°СЏ С„РѕСЂРјР° `Refs <repo>#N` С‚РѕР¶Рµ РїРѕРЅРёРјР°РµС‚СЃСЏ,
            # РЅРѕ С‚РѕР»СЊРєРѕ РµСЃР»Рё `<repo>` вЂ” С‚РµРєСѓС‰РёР№ СЂРµРїРѕР·РёС‚РѕСЂРёР№: РєСЂРѕСЃСЃ-СЂРµРїРѕ Р±РѕС‚ РЅРµ РІРµРґС‘С‚.
            closing_issues=$(echo "$body" | grep -oiE '(closes|fixes|resolves|fix|close)[[:space:]]*#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
            issues=$(echo "$body" | grep -oiE '(closes|fixes|resolves|fix|close|refs|see|part[ _-]?of)[[:space:]]*#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
            local own_repo="${repo#*/}"
            issues=$(printf '%s\n%s\n' "$issues" \
              "$(echo "$body" | grep -oiE "(closes|fixes|resolves|fix|close|refs|see|part[ _-]?of)[[:space:]]+[A-Za-z0-9._-]*/${own_repo}[[:space:]]*#[0-9]+" | grep -oE '[0-9]+' | sort -u || true)" \
              | grep -E '^[0-9]+$' | sort -u || true)
            closing_issues=$(printf '%s\n%s\n' "$closing_issues" \
              "$(echo "$body" | grep -oiE "(closes|fixes|resolves|fix|close)[[:space:]]+[A-Za-z0-9._-]*/${own_repo}[[:space:]]*#[0-9]+" | grep -oE '[0-9]+' | sort -u || true)" \
              | grep -E '^[0-9]+$' | sort -u || true)
            if [ -z "$issues" ]; then
              issues=$(echo "$head" | grep -oE 'issues-[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
              closing_issues="$issues"
            fi
            [ -z "$issues" ] && { echo "  $repo #$num: no linked issues, skip"; return 0; }

            local new_label comment close_issue
            if [ "$base" = "main" ]; then
              new_label=status:released
              close_issue=true
            elif [ "$release_label" = "true" ]; then
              new_label=status:in-release
              close_issue=false
            elif [ "$base" = "develop" ]; then
              new_label=status:in-develop
              close_issue=false
            else
              return 0
            fi

            for issue in $issues; do
              echo "  $repo #$issue в†’ $new_label"

              # РљРѕРјРјРµРЅС‚Р°СЂРёР№ Р·Р°РІРёСЃРёС‚ РѕС‚ С‚РѕРіРѕ, Р·Р°РєСЂС‹РІР°СЋС‰РёР№ СЌС‚Рѕ PR РёР»Рё Р»РёС€СЊ СѓРїРѕРјРёРЅР°СЋС‰РёР№.
              if echo "$closing_issues" | grep -qx "$issue"; then
                comment="[lifecycle-bot] рџЋ‰ Released to \`main\` via [#${num}](${pr_url})."
                if [ "$close_issue" = "true" ]; then
                  comment="[lifecycle-bot] рџЋ‰ Released to \`main\` and closed via [#${num}](${pr_url})."
                fi
              else
                case "$new_label" in
                  status:released)
                    comment="[lifecycle-bot] рџЋ‰ Released to \`main\` via [#${num}](${pr_url}). Issue РѕСЃС‚Р°С‘С‚СЃСЏ РѕС‚РєСЂС‹С‚С‹Рј: PR Р»РёС€СЊ СѓРїРѕРјРёРЅР°РµС‚ Р·Р°РґР°С‡Сѓ, Р° РЅРµ Р·Р°РєСЂС‹РІР°РµС‚ РµС‘. Р—Р°РєСЂС‹С‚РёРµ вЂ” Р·Р° С‡РµР»РѕРІРµРєРѕРј."
                    ;;
                  status:in-release)
                    comment="[lifecycle-bot] рџљЂ Release PR opened: [#${num}](${pr_url})."
                    ;;
                  *)
                    comment="[lifecycle-bot] рџџў Merged to \`develop\` via [#${num}](${pr_url})."
                    ;;
                esac
              fi

              if gh issue view "$issue" --repo "$repo" --json comments --jq '.comments[].body' 2>/dev/null | grep -Fxq -- "$comment"; then
                echo "    (comment already exists)"
              elif gh issue comment "$issue" --repo "$repo" --body "$comment" 2>/dev/null; then
                :
              else
                echo "    (no comment access, skipping comment)"
              fi

              # Monotone status: СЂРѕРІРЅРѕ РѕРґРЅР° status-РјРµС‚РєР° РѕС‚СЂР°Р¶Р°РµС‚ С‚РµРєСѓС‰РµРµ СЃРѕСЃС‚РѕСЏРЅРёРµ.
              local stale_labels
              stale_labels=$(gh issue view "$issue" --repo "$repo" --json labels --jq '.labels[].name' 2>/dev/null \
                | grep -E '^status:' | grep -vxF "$new_label" || true)
              for stale in $stale_labels; do
                gh issue edit "$issue" --repo "$repo" --remove-label "$stale" 2>/dev/null \
                  && echo "    removed $stale"
              done

              if gh issue edit "$issue" --repo "$repo" --add-label "$new_label" 2>/dev/null; then
                :
              else
                echo "    (no edit access, skipping label)"
              fi
              if [ "$close_issue" = "true" ] && echo "$closing_issues" | grep -qx "$issue"; then
                gh issue close "$issue" --repo "$repo" --reason completed 2>/dev/null || \
                  echo "    (no close access, skipping close)"
              fi
            done
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            jq -r '
              .pull_request |
              [.number, .base.ref, .body // "", .html_url, .head.ref, (.labels // [] | map(.name) | join(","))] |
              @tsv
            ' <<<"$EVENT_PAYLOAD" | while IFS=$'\t' read -r num base body pr_url head labels; do
              has_release="false"
              echo "$labels" | grep -qw release && has_release="true"
              process_pr "$EVENT_REPOSITORY" "$num" "$base" "$body" "$pr_url" "$head" "$has_release"
            done
          else
            since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                    date -u -v-8d +%Y-%m-%dT%H:%M:%SZ)
            for repo in "${TARGET[@]}"; do
              echo "--- $repo ---"
              prs=$(gh pr list --repo "$repo" --state merged --limit 1000 --search "merged:>=$since" --json number,baseRefName,body,url,headRefName,labels 2>/dev/null) || {
                echo "  (skipped: no access)"
                continue
              }
              echo "$prs" | jq -c '.[]' | while read -r pr; do
                num=$(echo "$pr" | jq -r .number)
                base=$(echo "$pr" | jq -r .baseRefName)
                body=$(echo "$pr" | jq -r '.body // ""')
                pr_url=$(echo "$pr" | jq -r .url)
                head=$(echo "$pr" | jq -r .headRefName)
                labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')
                has_release="false"
                echo "$labels" | grep -qw release && has_release="true"
                process_pr "$repo" "$num" "$base" "$body" "$pr_url" "$head" "$has_release"
              done
            done
          fi

  # ---------------------------------------------------------------
  # Inbox auto-stamper: СЃС‚Р°РІРёС‚ status:inbox РЅР° СЃРІРµР¶РёРµ issue Р±РµР· РјРµС‚РѕРє.
  # РўСЂРёРіРіРµСЂ: РїСЂРё РѕС‚РєСЂС‹С‚РёРё issue. РќРµ С‚СЂРѕРіР°РµС‚ СЃСѓС‰РµСЃС‚РІСѓСЋС‰РёРµ РјРµС‚РєРё.
  # ---------------------------------------------------------------
  inbox-stamper:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Stamp status:inbox on unlabeled issue
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # РЈР±РµР¶РґР°РµРјСЃСЏ, С‡С‚Рѕ РјРµС‚РєР° СЃСѓС‰РµСЃС‚РІСѓРµС‚
          gh label create "status:inbox" --color "fef2c0" \
            --description "РќРѕРІР°СЏ issue, РЅРµ СЂР°Р·РѕР±СЂР°РЅР°. Р‘РѕС‚ СЃС‚Р°РІРёС‚ Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРё" \
            --repo "$REPO" --force >/dev/null 2>&1 || true

          # РџРѕР»СѓС‡Р°РµРј С‚РµРєСѓС‰РёРµ РјРµС‚РєРё issue
          current_labels=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          # РќРµ С‚СЂРѕРіР°РµРј, РµСЃР»Рё СѓР¶Рµ РµСЃС‚СЊ РєР°РєРёРµ-С‚Рѕ РјРµС‚РєРё (Р·РЅР°С‡РёС‚, С‡РµР»РѕРІРµРє СѓР¶Рµ СЂР°Р·Р±РёСЂР°РµС‚)
          if [ -n "$current_labels" ]; then
            echo "Issue #$ISSUE_NUMBER already has labels ($current_labels), skip"
            exit 0
          fi

          # Р‘РѕС‚ СЃС‚Р°РІРёС‚ status:inbox
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "status:inbox" 2>/dev/null || \
            echo "  (no edit access, skipping)"
          echo "Issue #$ISSUE_NUMBER в†’ status:inbox"

  # ---------------------------------------------------------------
  # Stale-detector: СЃС‚Р°РІРёС‚ coordination:needs-decision РЅР° Р·Р°СЃС‚СЂСЏРІС€РёРµ issue.
  # РўСЂРёРіРіРµСЂ: РµР¶РµРЅРµРґРµР»СЊРЅР°СЏ РїРѕРґСЃС‚СЂР°С…РѕРІРєР°, С‚РѕР»СЊРєРѕ С‚РµРєСѓС‰РёР№ СЂРµРїРѕР·РёС‚РѕСЂРёР№.
  # РСЃРєР»СЋС‡РµРЅРёСЏ:
  #   - issue РёРјРµРµС‚ assignees (РєС‚Рѕ-С‚Рѕ СЂР°Р±РѕС‚Р°РµС‚)
  #   - issue СѓР¶Рµ released
  #   - СѓР¶Рµ РµСЃС‚СЊ coordination:needs-decision
  # Р”Р»СЏ СЌРїРёРєРѕРІ: РґРѕРїРѕР»РЅРёС‚РµР»СЊРЅРѕ РїСЂРѕРІРµСЂСЏРµС‚ РЅР°Р»РёС‡РёРµ ## Sub-tasks (7 РґРЅРµР№).
  # ---------------------------------------------------------------
  stale-detector:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 1') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ${{ vars.MINCHAT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Detect stale issues
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FLOW_REPOS=("$EVENT_REPOSITORY")

          ensure_label() {
            gh label create "$1" --color "$2" --description "$3" \
              --repo "$4" --force >/dev/null 2>&1 || true
          }

          for repo in "${FLOW_REPOS[@]}"; do
            echo "--- $repo ---"
            ensure_label "coordination:needs-decision" "fbc740" \
              "Р—Р°РґР°С‡Р° Р·Р°СЃС‚СЂСЏР»Р°, РЅСѓР¶РЅРѕ СЂРµС€РµРЅРёРµ" "$repo"

            # РџРѕР»СѓС‡Р°РµРј РѕС‚РєСЂС‹С‚С‹Рµ issue, РѕР±РЅРѕРІР»С‘РЅРЅС‹Рµ Р±РѕР»РµРµ 14 РґРЅРµР№ РЅР°Р·Р°Рґ.
            # REST API РїР°РіРёРЅРёСЂСѓРµС‚СЃСЏ РѕРґРёРЅ СЂР°Р·; С„РёР»СЊС‚СЂР°С†РёСЏ РїРѕ updated_at Р»РѕРєР°Р»СЊРЅР°СЏ.
            cutoff=$(date -u -d '14 days ago' +%Y-%m-%d 2>/dev/null || \
                     date -u -v-14d +%Y-%m-%d)

            issues=$(gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | {number, title, labels, assignees, updatedAt: .updated_at}' \
              | jq -c --arg cutoff "$cutoff" 'select(.updatedAt[0:10] < $cutoff)') || { echo "Cannot inspect stale issues in $repo" >&2; exit 1; }

            if [ -z "$issues" ]; then
              continue
            fi

              echo "$issues" | while read -r issue; do
                num=$(echo "$issue" | jq -r .number)
                labels=$(echo "$issue" | jq -r '[.labels[].name] | join(",")')
                assignees=$(echo "$issue" | jq -r '[.assignees[].login] | join(",")')

                # РџСЂРѕРїСѓСЃРєР°РµРј, РµСЃР»Рё РµСЃС‚СЊ assignees
                if [ -n "$assignees" ]; then
                  echo "  #$num: skip (has assignee)"
                  continue
                fi

                # РџСЂРѕРїСѓСЃРєР°РµРј, РµСЃР»Рё СѓР¶Рµ released РёР»Рё in-review/in-develop/in-release
                if echo "$labels" | grep -qwE 'status:(released|in-review|in-develop|in-release)'; then
                  echo "  #$num: skip (active status)"
                  continue
                fi

                # РџСЂРѕРїСѓСЃРєР°РµРј, РµСЃР»Рё СѓР¶Рµ СЃС‚РѕРёС‚ coordination:needs-decision
                if echo "$labels" | grep -qw 'coordination:needs-decision'; then
                  echo "  #$num: skip (already needs-decision)"
                  continue
                fi

                # РџСЂРѕРІРµСЂСЏРµРј, СЌРїРёРє Р»Рё СЌС‚Рѕ (РµСЃС‚СЊ type:feature + area:hq РёР»Рё РЅРµС‚ sub-tasks С‡РµСЂРµР· 7 РґРЅРµР№)
                is_epic=false
                if echo "$labels" | grep -qw 'area:hq' && echo "$labels" | grep -qwE 'type:feature|type:research'; then
                  # Р­РїРёРє = issue СЃ type:feature|research Рё area:hq.
                  # РџСЂРѕРІРµСЂСЏРµРј body РЅР° ## Sub-tasks
                  body=$(gh issue view "$num" --repo "$repo" --json body --jq '.body // ""' 2>/dev/null || echo "")
                  if ! echo "$body" | grep -qiE '^##[[:space:]]*sub-tasks'; then
                    created_cutoff=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || \
                                     date -u -v-7d +%Y-%m-%d)
                    created_at=$(gh issue view "$num" --repo "$repo" --json createdAt --jq '.createdAt' 2>/dev/null | cut -c1-10 || echo "")
                    if [ -n "$created_at" ] && [ "$created_at" \< "$created_cutoff" ]; then
                      is_epic=true
                      reason="epic Р±РµР· ## Sub-tasks Р±РѕР»РµРµ 7 РґРЅРµР№"
                    fi
                  fi
                fi

                if [ "$is_epic" != "true" ]; then
                  # РџРѕ СѓРјРѕР»С‡Р°РЅРёСЋ вЂ” РѕР±С‹С‡РЅР°СЏ stale-РїСЂРѕРІРµСЂРєР° (14 РґРЅРµР№ Р±РµР· Р°РєС‚РёРІРЅРѕСЃС‚Рё).
                  reason="РЅРµС‚ Р°РєС‚РёРІРЅРѕСЃС‚Рё Р±РѕР»РµРµ 14 РґРЅРµР№"
                fi

                echo "  #$num в†’ coordination:needs-decision ($reason)"
                gh issue edit "$num" --repo "$repo" --add-label "coordination:needs-decision" 2>/dev/null || \
                  echo "    (no edit access, skipping)"
                comment_body="[lifecycle-bot] вЏ° Р—Р°РґР°С‡Р° РїРѕРјРµС‡РµРЅР° РєР°Рє Р·Р°СЃС‚СЂСЏРІС€Р°СЏ: **$reason**. РќСѓР¶РЅРѕ СЂРµС€РµРЅРёРµ вЂ” РїСЂРёРЅСЏС‚СЊ, Р·Р°РєСЂС‹С‚СЊ РёР»Рё СЌСЃРєР°Р»РёСЂРѕРІР°С‚СЊ. РЎРј. saved view В«Feature PlanningВ»."
                gh issue comment "$num" --repo "$repo" --body "$comment_body" 2>/dev/null || \
                  echo "    (no comment access, skipping)"
              done

          done
